name: CI

# The release evidence matrix: the same gate on Linux and on Windows,
# because a Windows-only failure is a release failure (packed-consumer
# portability, glob quoting, newline normalization, `.cmd` shims, drive
# letters and per-platform native packages are all platform classes of
# defect — the last three found by a Windows consumer running this very
# gate). QT3 conformance and the dead-code audit remain separate evidence
# runs (they need the qt3tests submodule and a long coverage pass) — they
# are not silently implied by this green.
#
# Third-party actions are pinned to commit SHAs rather than moving major
# tags. A tag is a pointer its owner can repoint, so `@v6` means "whatever
# that repository decides v6 is at the moment this job runs" — for a
# workflow with checkout and install rights that is a supply-chain edge
# nobody reviews. The readable version stays in the trailing comment.
#
# The whole toolchain is pinned and moves together: Node from .nvmrc, npm
# to the version that wrote package-lock.json (an older npm rewrites the
# lock WITHOUT other platforms' native packages — npm/cli#7961 — which is
# exactly how the Windows gate once went red), and Bun to the audited
# release rather than "latest".
#
# Steps carry explicit `if` conditions instead of relying on GitHub's
# skip-after-failure default: a failed test run must not suppress the
# independent build/type/tree evidence of the same job. A failure still
# reddens the job — nothing here is continue-on-error.

on:
  push:
    branches: [main]
  pull_request:

env:
  NPM_VERSION: 11.12.1
  BUN_VERSION: 1.3.14

# Least privilege by default: nothing here writes to the repository, and a
# job that needs more should ask for it explicitly rather than inherit it.
permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Report toolchain
        run: |
          node --version
          npm --version

      # Before any install: a lock pruned of other platforms' exact optional
      # records is a structural defect this job can prove from the file alone.
      - name: Validate portable lock
        id: lock
        run: npm run test:lock

      - name: Clean install
        id: install
        if: ${{ !cancelled() && steps.lock.outcome == 'success' }}
        run: npm ci --include=optional

      # After the install: THIS platform's native packages for the build
      # tools must actually be on disk, loudly, not first discovered by tsc
      # dying mid-build.
      - name: Native toolchain probe
        id: native
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:native

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Clean generated output
        id: clean
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run clean

      - name: Build
        id: build
        if: >-
          ${{ !cancelled() &&
              steps.install.outcome == 'success' &&
              steps.clean.outcome == 'success' }}
        run: npm run build

      - name: Type declarations
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:types

      - name: Tree shaking
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:tree-shaking

      - name: Set up Bun
        id: bun
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Packed consumers
        if: >-
          ${{ !cancelled() &&
              steps.build.outcome == 'success' &&
              steps.bun.outcome == 'success' }}
        run: npm run test:packed:release

      - name: Pack dry-run
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run pack:check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm run test:lock
      - run: npm ci --include=optional
      # The LOCKED local Playwright, not whatever `npx` would fetch today.
      - run: npm exec -- playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser

  # Consumption evidence, split by what it proves:
  #  - dependency-policy: the dependency closure a consumer inherits, plus
  #    the advisory audit — needs the installed tree, runs where it is cheap.
  #  - source-consumption: the submodule/pnpm topology fixture. It runs on
  #    Windows too — executable shims, drive letters and realpath containment
  #    are demonstrably platform-sensitive — and deliberately WITHOUT a root
  #    `npm ci`: npm's workspace symlinks would satisfy the internal edges
  #    before pnpm's own settings ever apply, and the fixture must prove the
  #    recipe, not the leftovers.
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm run test:lock
      - run: npm ci --include=optional
      - run: npm run test:deps

  source-consumption:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      # Deliberately no root npm ci here: the fixture must prove source links
      # without pre-existing npm workspace symlinks.
      - run: npm run test:source:release
