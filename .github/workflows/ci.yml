name: CI

# Hosted qualification runs on Linux. Windows checks are opt-in to bound
# hosted runner cost; the complete backup and local act instructions live
# in .github/optional-workflows/windows.yml and docs/workflow/WINDOWS.md.
# A green hosted run does not establish Windows qualification.
# QT3 conformance and the dead-code audit remain separate evidence runs
# (they need the qt3tests submodule and a long coverage pass).
#
# Third-party actions are pinned to commit SHAs rather than moving major
# tags. A tag is a pointer its owner can repoint, so `@v6` means "whatever
# that repository decides v6 is at the moment this job runs" — for a
# workflow with checkout and install rights that is a supply-chain edge
# nobody reviews. The readable version stays in the trailing comment.
#
# The whole toolchain is pinned and moves together: Node from .nvmrc, npm
# to the version that wrote package-lock.json (an older npm rewrites the
# lock WITHOUT other platforms' native packages — npm/cli#7961 — which is
# exactly how the Windows gate once went red), and Bun to the audited
# release rather than "latest".
#
# Steps carry explicit `if` conditions instead of relying on GitHub's
# skip-after-failure default: a failed test run must not suppress the
# independent build/type/tree evidence of the same job. A failure still
# reddens the job — nothing here is continue-on-error.

on:
  push:
    branches: [main]
  pull_request:

env:
  NPM_VERSION: 11.12.1
  BUN_VERSION: 1.4.2

# Least privilege by default: nothing here writes to the repository, and a
# job that needs more should ask for it explicitly rather than inherit it.
permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Report toolchain
        run: |
          node --version
          npm --version

      # Before any install: a lock pruned of other platforms' exact optional
      # records is a structural defect this job can prove from the file alone.
      - name: Validate portable lock
        id: lock
        run: npm run test:lock

      - name: Clean install
        id: install
        if: ${{ !cancelled() && steps.lock.outcome == 'success' }}
        run: npm ci --include=optional

      # After the install: THIS platform's native packages for the build
      # tools must actually be on disk, loudly, not first discovered by tsc
      # dying mid-build.
      - name: Native toolchain probe
        id: native
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:native

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      # The durability tests execute both runtimes before packed consumers run.
      - name: Set up Bun
        id: bun
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Bounded at the step, not only the job: a hung test run must fail
        # THIS step by name and let the independent build/type/tree/pack
        # evidence below still execute, instead of a 30-minute job cancel
        # that destroys it. The per-test `--test-timeout` in the test
        # script is the first line; this is the backstop.
        timeout-minutes: 15
        run: npm test

      - name: Clean generated output
        id: clean
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run clean

      - name: Build
        id: build
        if: >-
          ${{ !cancelled() &&
              steps.install.outcome == 'success' &&
              steps.clean.outcome == 'success' }}
        run: npm run build

      - name: Type declarations
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:types

      - name: Tree shaking
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:tree-shaking

      - name: Packed consumers
        if: >-
          ${{ !cancelled() &&
              steps.build.outcome == 'success' &&
              steps.bun.outcome == 'success' }}
        run: npm run test:packed:release

      - name: Pack dry-run
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run pack:check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm run test:lock
      - run: npm ci --include=optional
      # The LOCKED local Playwright, not whatever `npx` would fetch today.
      - run: npm exec -- playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser

  # Consumption evidence, split by what it proves:
  #  - dependency-policy: the dependency closure a consumer inherits, plus
  #    the advisory audit — needs the installed tree, runs where it is cheap.
  #  - source-consumption: the submodule/pnpm topology fixture. Windows
  #    shims, drive letters and containment remain in the optional backup.
  #    The root `npm ci` here is NOT a
  #    confound, it is the documented recipe's own precondition (CONSUMING.md):
  #    a `link:`ed package's transitive `@jarenjs/*` imports resolve by Node's
  #    upward walk from the SOURCE directory, and the checkout's own
  #    node_modules is the only local home that walk can find — skip the
  #    install and the fixture fails on resolution, proving nothing about
  #    containment. The corollary is that an end-to-end override teeth test is
  #    structurally confounded, so the detector's ability to say no is proven
  #    at the unit level instead (test/scripts/portable.test.js and the
  #    fixture's own self-checks).
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm run test:lock
      - run: npm ci --include=optional
      - run: npm run test:deps

  source-consumption:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm run test:lock
      # The documented recipe installs inside the vendored checkout — that is
      # what gives the source tree's internal edges a local home (see the job
      # comment above).
      - run: npm ci --include=optional
      - run: npm run test:source:release

  postgres:
    name: PostgreSQL ${{ matrix.major }} durable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 16
            image: postgres:16.15-bookworm@sha256:1938c16e9d2f10a6a3623b344b64ae8d45f407f2c5f34f0979468bb689b9227a
          - major: 17
            image: postgres:17.11-bookworm@sha256:7bade6d532592ca8ce7ee32def7399dad2607c4ea5583839fc4352a095a11ea6
          - major: 18
            image: postgres:18.6-bookworm@sha256:a10c981235b4f635e65df0cfb66a5598064628128505dbc6a3ed4ca303717521
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: jaren
          POSTGRES_PASSWORD: jaren
          POSTGRES_DB: jaren
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
          TZ: UTC
          PGTZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jaren -d jaren"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      JAREN_PG_URL: postgres://jaren:jaren@127.0.0.1:5432/jaren
      JAREN_PG_MAJOR: ${{ matrix.major }}
      JAREN_PG_DURABLE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --include=optional
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm run test:postgres
      - name: Coherent backup and restore
        if: ${{ !cancelled() }}
        env:
          JAREN_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run test:postgres:operations
      - name: Installed public application closure
        if: ${{ !cancelled() && matrix.major == 17 }}
        id: installed
        env:
          HOST_CONSUMER_OUTPUT: ${{ runner.temp }}/backend-consumer
        run: npm run test:packed:release
      - name: Build-selected standalone applications
        if: ${{ !cancelled() && matrix.major == 17 && steps.installed.outcome == 'success' }}
        run: npm run test:backend-executables -- "${{ runner.temp }}/backend-consumer"
      - name: Archived WAL recovery
        if: ${{ !cancelled() && matrix.major == 17 }}
        run: npm run test:postgres:recovery

  postgres-extensions:
    name: PostgreSQL extension fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAREN_PG_URL: postgres://jaren:jaren@127.0.0.1:55432/jaren
      JAREN_PG_MAJOR: '17'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --include=optional
      - run: docker compose -f docker/postgres/compose.yaml up -d --build --wait
      - run: npm run test:postgres
      - if: always()
        run: docker compose -f docker/postgres/compose.yaml down -v
